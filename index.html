<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kanji Match Dojo is a focused practice app for kanji, common expressions, and question paper review."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23b91c1c'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='34' font-family='Arial' font-weight='700' fill='white'%3EK%3C/text%3E%3C/svg%3E" />
    <title>Kanji Match Dojo</title>
    <script>
      // Set the page background before first paint so an overscroll bounce
      // never flashes a mismatched border in either theme.
      (function () {
        var stored = null;
        try {
          stored = window.localStorage.getItem('kanji-matcher-theme');
        } catch (e) {}
        var isDark =
          stored === 'dark' ||
          (stored !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        var bg = isDark ? '#12110f' : '#f6f4ef';
        document.documentElement.style.background = bg;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
